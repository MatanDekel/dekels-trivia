<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-label="DEKEL">
<style>
  .o{transform-box:view-box}
  .sun-breathe{transform-origin:600px 415px;animation:breathe 4s 1.2s ease-in-out infinite alternate}
  .sun{transform-origin:600px 415px;animation:pop .8s cubic-bezier(.2,.9,.3,1.25) both}
  .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .9s ease-out forwards}
  .trunk{animation-delay:.45s}
  .ground{animation-delay:.3s;animation-duration:1.1s}
  .rings{opacity:0;animation:fade .5s 1.15s ease-out forwards}
  .crown{transform-origin:600px 362px;animation:sway 3.2s 2.6s ease-in-out infinite alternate}
  .frond{transform-origin:600px 362px;animation:unfold .75s var(--d) cubic-bezier(.3,1.35,.5,1) both}
  .l{--r:35deg}.r{--r:-35deg}.c{--r:0deg}
  .word{animation:rise 1s 2.05s cubic-bezier(.2,.8,.2,1) both}
  .line{transform-origin:600px 927px;animation:grow .8s 2.5s ease-out both}
  @keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
  @keyframes breathe{from{transform:scale(1)}to{transform:scale(1.035)}}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes fade{to{opacity:1}}
  @keyframes unfold{from{transform:rotate(var(--r)) scale(0);opacity:0}to{transform:none;opacity:1}}
  @keyframes sway{from{transform:rotate(-2.5deg)}to{transform:rotate(2.5deg)}}
  @keyframes rise{from{opacity:0;transform:translateY(40px);letter-spacing:70px}to{opacity:1;transform:none;letter-spacing:28px}}
  @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @media (prefers-reduced-motion: reduce){
    *{animation:none!important}
    .draw{stroke-dashoffset:0}.rings{opacity:1}
  }
</style>
<rect width="1200" height="1200" fill="#FCF9F5"/>
<g class="o sun-breathe"><circle class="o sun" cx="600" cy="415" r="255" fill="#F2DEDA"/></g>
<path class="draw ground" pathLength="1" d="M414 678 Q600 711 786 678" stroke="#DBBEB7" stroke-width="5" fill="none" stroke-linecap="round"/>
<path class="draw trunk" pathLength="1" d="M563 657 C589 565 592 475 598 361" stroke="#8E9F8C" stroke-width="23" fill="none" stroke-linecap="round"/>
<path class="rings" d="M589 488 l23 -17 M583 530 l-22 -20 M579 567 l25 -20 M573 606 l-23 -20" stroke="#D9C7AD" stroke-width="5" stroke-linecap="round"/>
<g class="o crown">
  <g fill="#9DBBAA">
    <path class="o frond l" style="--d:1.75s" d="M600 362 C552 278 440 234 333 275 C431 271 526 307 600 362Z"/>
    <path class="o frond l" style="--d:1.9s" d="M600 362 C535 306 415 314 340 391 C455 343 531 355 600 362Z"/>
    <path class="o frond l" style="--d:1.6s" d="M600 362 C573 274 489 200 392 193 C490 238 553 301 600 362Z"/>
    <path class="o frond l" style="--d:1.45s" d="M600 362 C603 265 554 173 467 128 C535 214 570 290 600 362Z"/>
  </g>
  <g fill="#AFC8B4">
    <path class="o frond r" style="--d:1.8s" d="M600 362 C654 277 759 235 870 273 C760 274 677 309 600 362Z"/>
    <path class="o frond r" style="--d:1.95s" d="M600 362 C674 300 790 317 862 398 C746 347 673 358 600 362Z"/>
    <path class="o frond r" style="--d:1.65s" d="M600 362 C634 266 719 194 821 194 C722 243 647 311 600 362Z"/>
    <path class="o frond r" style="--d:1.5s" d="M600 362 C593 262 641 172 729 124 C661 216 625 292 600 362Z"/>
  </g>
  <path class="o frond c" style="--d:1.3s" d="M600 362 C570 263 572 177 606 105 C636 194 630 290 600 362Z" fill="#C2D3BB"/>
</g>
<text class="o word" x="600" y="865" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="133" letter-spacing="28" fill="#60766B">DEKEL</text>
<path class="o line" d="M428 927 H772" stroke="#D9C4BB" stroke-width="3"/>
</svg>
